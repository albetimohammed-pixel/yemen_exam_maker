name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Project and Android Files
        run: |
          # حفظ الملفات الخاصة بنا مؤقتاً
          mkdir -p temp_backup
          cp -r lib temp_backup/ 2>/dev/null || true
          cp pubspec.yaml temp_backup/ 2>/dev/null || true
          
          # إنعاش وتوليد هيكل الأندرويد الكامل
          flutter create . --overwrite --org com.yemen.exam --project-name yemen_exam_maker
          
          # استعادة ملفاتنا البرمجية الرئيسية
          cp -r temp_backup/lib . 2>/dev/null || true
          cp temp_backup/pubspec.yaml . 2>/dev/null || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yemen-exam-app
          path: build/app/outputs/flutter-apk/app-release.apk
